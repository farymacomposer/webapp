services:

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: composer-frontend
    ports:
      - "3000:3000"
    networks:
      - composer-net
    depends_on:
      - webapi
    restart: unless-stopped

  webapi:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: composer-webapi
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:?ASPNETCORE_ENVIRONMENT is required}"
      ASPNETCORE_HTTP_PORTS: 8080
      POSTGRES__HOST: db
      POSTGRES__PORT: 5432
      POSTGRES__DATABASE: "${POSTGRES__DATABASE:?POSTGRES__DATABASE is required}"
      POSTGRES__USERNAME: "${POSTGRES__USERNAME:?POSTGRES__USERNAME is required}"
      POSTGRES__PASSWORD: "${POSTGRES__PASSWORD:?POSTGRES__PASSWORD is required}"
      JWT__ISSUER: "${JWT__ISSUER:?JWT__ISSUER is required}"
      JWT__AUDIENCE: "${JWT__AUDIENCE:?JWT__AUDIENCE is required}"
      JWT__SECRET_KEY: "${JWT__SECRET_KEY:?JWT__SECRET_KEY is required}"
      JWT__EXPIRY_IN_MINUTES: "${JWT__EXPIRY_IN_MINUTES:?JWT__EXPIRY_IN_MINUTES is required}"
      TWITCH__CLIENT_ID: "${TWITCH__CLIENT_ID:?TWITCH__CLIENT_ID is required}"
      TWITCH__CLIENT_SECRET: "${TWITCH__CLIENT_SECRET:?TWITCH__CLIENT_SECRET is required}"
      TWITCH__REDIRECT_URI: "${TWITCH__REDIRECT_URI:?TWITCH__REDIRECT_URI is required}"
      TWITCH__LOGIN_SUCCESS_REDIRECT_URI: "${TWITCH__LOGIN_SUCCESS_REDIRECT_URI:?TWITCH__LOGIN_SUCCESS_REDIRECT_URI is required}"
      TWITCH__LOGIN_FAILURE_REDIRECT_URI: "${TWITCH__LOGIN_FAILURE_REDIRECT_URI:?TWITCH__LOGIN_FAILURE_REDIRECT_URI is required}"
      ADMIN_BOOTSTRAP__COMPOSER__USERNAME: "${ADMIN_BOOTSTRAP__COMPOSER__USERNAME:?ADMIN_BOOTSTRAP__COMPOSER__USERNAME is required}"
      ADMIN_BOOTSTRAP__COMPOSER__PASSWORD: "${ADMIN_BOOTSTRAP__COMPOSER__PASSWORD:?ADMIN_BOOTSTRAP__COMPOSER__PASSWORD is required}"
      ADMIN_BOOTSTRAP__MODERATOR__USERNAME: "${ADMIN_BOOTSTRAP__MODERATOR__USERNAME:?ADMIN_BOOTSTRAP__MODERATOR__USERNAME is required}"
      ADMIN_BOOTSTRAP__MODERATOR__PASSWORD: "${ADMIN_BOOTSTRAP__MODERATOR__PASSWORD:?ADMIN_BOOTSTRAP__MODERATOR__PASSWORD is required}"
      FORWARDED_HEADERS__KNOWN_NETWORKS__0: "${FORWARDED_HEADERS__KNOWN_NETWORKS__0:?FORWARDED_HEADERS__KNOWN_NETWORKS__0 is required}"
    ports:
      - "8080:8080"
    networks:
      - composer-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    container_name: composer-db
    environment:
      POSTGRES_DB: "${POSTGRES__DATABASE:?POSTGRES__DATABASE is required}"
      POSTGRES_USER: "${POSTGRES__USERNAME:?POSTGRES__USERNAME is required}"
      POSTGRES_PASSWORD: "${POSTGRES__PASSWORD:?POSTGRES__PASSWORD is required}"
    ports:
      - "5432:5432"
    networks:
      - composer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  composer-net:
    driver: bridge
    ipam:
      config:
        - subnet: "${COMPOSER_NETWORK_SUBNET:?COMPOSER_NETWORK_SUBNET is required}"