services:

  frontend:
    build:
      dockerfile: frontend.Dockerfile
    container_name: composer-frontend
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    networks:
      - composer-net
    depends_on:
      - webapi
    restart: unless-stopped

  webapi:
    build:
      dockerfile: backend.Dockerfile
    container_name: composer-webapi
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: 8080
      POSTGRES__HOST: db
      POSTGRES__PORT: 5432
      POSTGRES__DATABASE: ${POSTGRES__DATABASE}
      POSTGRES__USERNAME: ${POSTGRES__USERNAME}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD}
      JWT__ISSUER: ${JWT__ISSUER}
      JWT__AUDIENCE: ${JWT__AUDIENCE}
      JWT__SECRET_KEY: ${JWT__SECRET_KEY}
      JWT__EXPIRY_IN_MINUTES: ${JWT__EXPIRY_IN_MINUTES}
    ports:
      - "8080:8080"
    networks:
      - composer-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: composer-db
    environment:
      POSTGRES_DB: ${POSTGRES__DATABASE}
      POSTGRES_USER: ${POSTGRES__USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - composer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES__USERNAME} -d ${POSTGRES__DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  composer-net:
    driver: bridge