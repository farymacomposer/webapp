name: Roslynator → Tests

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'backend/**'

jobs:
  Roslynator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Pull Roslynator image
        run: docker pull ghcr.io/mnham/roslynatoranalyzer:latest

      - name: Run Roslynator
        run: docker run -t --rm -v "${{ github.workspace }}:/src" ghcr.io/mnham/roslynatoranalyzer:latest

  Tests:
    needs: Roslynator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run Tests
        run: dotnet test backend/src/Faryma.Composer.Core.Test/Faryma.Composer.Core.Test.csproj --configuration Release
