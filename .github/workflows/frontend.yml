name: ESLint

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'

jobs:
  ESLint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Run ESLint
        run: |
          docker run -t --rm \
            -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0 \
            -v "${{ github.workspace }}/frontend:/src" \
            -w /src \
            node:jod-slim \
            sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm exec eslint ."